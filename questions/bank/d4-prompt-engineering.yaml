# Domain 4 — Prompt Engineering & Structured Output (20%)
# 18 original items, 3 per task statement. See ../question-style-guide.md
---
- id: d4-4.1-001
  domain: 4
  task_statement: "4.1"
  scenario: [5]
  select_count: 1
  stem: >
    Your automated review flags too many non-issues. You have already added
    "be conservative and only report high-confidence findings" to the prompt, with
    no measurable change. What is the most effective next step?
  options:
    - id: A
      text: >
        Add a numeric confidence threshold and drop findings below it.
      verdict: wrong
      distractor_family: unreliable-proxy
      why: >
        Self-reported confidence is poorly calibrated, so a threshold filters on a
        number that does not track correctness.
    - id: B
      text: >
        Reduce the number of files reviewed per run so the model has more attention
        per file.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Attention per file affects depth and consistency, not whether the model
        knows which findings are worth reporting.
    - id: C
      text: >
        Replace the general instruction with explicit criteria defining which
        categories to report (bugs, security) and which to skip (minor style, local
        patterns).
      verdict: correct
      why: >
        General instructions to raise the bar give the model no standard to apply.
        Categorical criteria define exactly what counts, which is what changes the
        output.
    - id: D
      text: >
        Have a second model instance filter the findings before they are posted.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        Adding a filtering stage before defining what should be reported means the
        second instance faces the same undefined standard.
  correct: [C]
  source: original

- id: d4-4.1-002
  domain: 4
  task_statement: "4.1"
  scenario: [5]
  select_count: 1
  stem: >
    One of five review categories has a roughly 40% false positive rate. Developers
    have begun ignoring all review comments, including from the four accurate
    categories. What is the most effective immediate action?
  options:
    - id: A
      text: >
        Post all findings but mark the unreliable category as low confidence.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        The noise still appears in every review. Labelling it does not stop
        developers from scrolling past the whole comment block.
    - id: B
      text: >
        Lower the global confidence threshold across all five categories.
      verdict: wrong
      distractor_family: unreliable-proxy
      why: >
        This degrades four working categories to compensate for one, and relies on
        an uncalibrated confidence signal.
    - id: C
      text: >
        Temporarily disable the high-false-positive category while its criteria are
        improved, restoring trust in the remaining four.
      verdict: correct
      why: >
        Trust is per-category and one noisy category undermines confidence in the
        accurate ones. Removing the noise recovers the value of the categories that
        work while the broken one is fixed.
    - id: D
      text: >
        Move the noisy category's findings into a separate report developers can
        opt into.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        This builds a second delivery channel for output that is currently wrong,
        rather than fixing or removing it.
  correct: [C]
  source: original

- id: d4-4.1-003
  domain: 4
  task_statement: "4.1"
  scenario: [5]
  select_count: 1
  stem: >
    The same class of defect is labelled "critical" in one review and "minor" in
    another. Your prompt defines the severity levels as "critical, major, minor"
    with a sentence describing each. What most effectively improves consistency?
  options:
    - id: A
      text: >
        Define explicit severity criteria with concrete code examples for each
        level.
      verdict: correct
      why: >
        Adjectival definitions leave the boundary to judgment, which drifts between
        runs. Concrete examples anchor each level to something checkable.
    - id: B
      text: >
        Reduce the scheme to two levels so there are fewer boundaries to confuse.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Fewer levels means fewer boundaries but each remains undefined, so the same
        drift occurs at the one boundary that is left.
    - id: C
      text: >
        Have the model assign a numeric score and derive severity from thresholds.
      verdict: wrong
      distractor_family: unreliable-proxy
      why: >
        This converts an undefined judgment into an undefined number. The threshold
        is arbitrary without calibration.
    - id: D
      text: >
        Run each review twice and take the more severe of the two labels.
      verdict: wrong
      distractor_family: suppresses-signal
      why: >
        This doubles cost and systematically biases severity upward rather than
        making classification consistent.
  correct: [A]
  source: original

- id: d4-4.2-001
  domain: 4
  task_statement: "4.2"
  scenario: [6]
  select_count: 1
  stem: >
    Your extraction prompt has detailed instructions describing the output fields,
    yet the shape of the returned data still varies between documents. What
    technique most directly addresses this?
  options:
    - id: A
      text: >
        Expand the instructions with more precise field descriptions.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        The stem states the instructions are already detailed. More of the same
        medium is unlikely to change the outcome.
    - id: B
      text: >
        Lower the temperature so output varies less between runs.
      verdict: wrong
      distractor_family: unreliable-proxy
      why: >
        Sampling settings do not teach a format. The variation described is across
        documents, not across repeated runs on the same input.
    - id: C
      text: >
        Add two to four few-shot examples demonstrating the desired output format.
      verdict: correct
      why: >
        Few-shot examples are the most effective technique when detailed
        instructions alone produce inconsistent results — the situation described
        exactly.
    - id: D
      text: >
        Add ten to twelve examples covering every document type you expect.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        Volume is not the mechanism. A small number of targeted examples conveys the
        format; a dozen inflates every request without proportional benefit.
  correct: [C]
  source: original

- id: d4-4.2-002
  domain: 4
  task_statement: "4.2"
  scenario: [1]
  select_count: 1
  stem: >
    An agent handles clear-cut requests well but behaves inconsistently on ambiguous
    ones — cases where two tools could plausibly apply. What kind of few-shot
    examples would help most?
  options:
    - id: A
      text: >
        Examples showing the correct output for each ambiguous case, without
        explaining the choice.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Outcomes without reasoning teach pattern matching on the specific cases
        shown, and generalise poorly to ambiguous cases you did not anticipate.
    - id: B
      text: >
        A larger set of examples covering the clear-cut cases, so the boundary
        becomes apparent by contrast.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Clear-cut cases are already handled correctly. Adding them teaches nothing
        about the boundary that is failing.
    - id: C
      text: >
        An enumerated rule list covering every ambiguous combination you can think
        of.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Rules cover only what you enumerate. The value of examples here is
        generalisation to novel patterns.
    - id: D
      text: >
        Two to four examples of ambiguous cases, each showing the reasoning for why
        one action was chosen over a plausible alternative.
      verdict: correct
      why: >
        Examples carry judgment that instructions cannot, and showing the reasoning
        lets the model generalise the decision rule rather than memorising the case.
  correct: [D]
  source: original

- id: d4-4.2-003
  domain: 4
  task_statement: "4.2"
  scenario: [6]
  select_count: 1
  stem: >
    Extraction works well on documents that use bibliographies, but required fields
    come back empty on documents using inline citations and narrative methodology
    sections. What is the most effective change?
  options:
    - id: A
      text: >
        Mark the affected fields as nullable so empty results are valid.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Nullable fields are right when the information is genuinely absent. Here it
        is present but formatted differently, so this would legitimise a real
        extraction failure.
    - id: B
      text: >
        Add few-shot examples demonstrating correct extraction from the varied
        document structures, including inline citations and narrative sections.
      verdict: correct
      why: >
        The model handles the structures it has seen demonstrated. Examples covering
        the structural variety teach it where the same information lives in
        differently organised documents.
    - id: C
      text: >
        Pre-process documents into a common structure before extraction.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        Building a normalisation pipeline for arbitrary document layouts is a large
        undertaking compared with demonstrating the variety in the prompt.
    - id: D
      text: >
        Route documents by structure to separate extraction prompts.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        This multiplies prompts to maintain and requires reliable structure
        detection, when one prompt with varied examples generalises.
  correct: [B]
  source: original

- id: d4-4.3-001
  domain: 4
  task_statement: "4.3"
  scenario: [6]
  select_count: 1
  stem: >
    Your extraction pipeline occasionally fails to parse the model's response
    because the JSON is malformed. You currently ask for JSON in the prompt and
    parse the text output. What is the most reliable fix?
  options:
    - id: A
      text: >
        Use a more permissive JSON parser that tolerates common formatting errors.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This accommodates malformed output rather than preventing it, and a
        permissive parser can silently misinterpret ambiguous input.
    - id: B
      text: >
        Define the extraction schema as a tool's input schema and read the result
        from the tool_use response.
      verdict: correct
      why: >
        Tool use with a JSON schema is the mechanism for guaranteed
        schema-compliant output, and it eliminates JSON syntax errors rather than
        reducing their frequency.
    - id: C
      text: >
        Add a retry that re-prompts when parsing fails.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Retrying manages the symptom at extra cost while leaving the failure mode
        in place.
    - id: D
      text: >
        Add few-shot examples of correctly formatted JSON to the prompt.
      verdict: wrong
      distractor_family: prompt-instead-of-enforcement
      why: >
        Examples improve compliance probabilistically. Tool use removes the
        possibility of malformed output entirely.
  correct: [B]
  source: original

- id: d4-4.3-002
  domain: 4
  task_statement: "4.3"
  scenario: [6]
  select_count: 1
  stem: >
    Invoice extractions pass schema validation, but downstream reconciliation finds
    cases where the line items do not sum to the extracted total. What does this
    tell you?
  options:
    - id: A
      text: >
        The schema is under-specified and should constrain the total field to match
        the sum of line items.
      verdict: wrong
      distractor_family: blames-wrong-component
      why: >
        JSON Schema cannot express a cross-field arithmetic relationship, so this
        constraint cannot be written where the option suggests.
    - id: B
      text: >
        tool_choice should be set to forced selection to ensure the right extraction
        tool runs.
      verdict: wrong
      distractor_family: blames-wrong-component
      why: >
        The correct tool did run and produced valid output. The problem is the
        content, not the tool selection.
    - id: C
      text: >
        The model needs a lower temperature to reduce arithmetic errors.
      verdict: wrong
      distractor_family: unreliable-proxy
      why: >
        The discrepancy may originate in the source document rather than the model,
        and sampling settings are not an arithmetic control.
    - id: D
      text: >
        Strict schemas eliminate syntax errors but not semantic ones, so semantic
        validation must be added separately.
      verdict: correct
      why: >
        A schema constrains shape — types, required fields, enum membership. A set
        of numbers that fails to add up is well-formed and therefore passes, which
        is why semantic checks are a separate layer.
  correct: [D]
  source: original

- id: d4-4.3-003
  domain: 4
  task_statement: "4.3"
  scenario: [6]
  select_count: 1
  stem: >
    Some source documents genuinely do not contain a purchase order number, but the
    extraction returns plausible-looking values for that field anyway. The field is
    currently required. What is the most effective fix?
  options:
    - id: A
      text: >
        Make the field optional or nullable so the model can return null when the
        information is absent.
      verdict: correct
      why: >
        A required field is an instruction to produce a value, and the model
        complies. Making it nullable gives the model somewhere honest to record
        absence.
    - id: B
      text: >
        Add a validation step that rejects extractions whose purchase order number
        does not match a known format.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        A fabricated value can easily match the expected format, so this catches
        only the obvious cases.
    - id: C
      text: >
        Add an empty string as the documented value for missing purchase order
        numbers.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        An empty string is a value, and downstream consumers cannot distinguish it
        from a genuine blank field as reliably as a null.
    - id: D
      text: >
        Add a prompt instruction never to invent values not present in the source.
      verdict: wrong
      distractor_family: prompt-instead-of-enforcement
      why: >
        The instruction conflicts with the schema, which still requires the field.
        The schema is the stronger signal.
  correct: [A]
  source: original

- id: d4-4.4-001
  domain: 4
  task_statement: "4.4"
  scenario: [6]
  select_count: 1
  stem: >
    Your validation-retry loop retries the same subset of documents up to its limit
    every run and never succeeds on them. Investigation shows the requested field
    appears only in a separate appendix document that is not supplied. What should
    change?
  options:
    - id: A
      text: >
        Mark the field nullable so the extraction passes validation.
      verdict: wrong
      distractor_family: suppresses-signal
      why: >
        This silences the failure without addressing that a required business field
        is genuinely missing and someone needs to know.
    - id: B
      text: >
        Include the specific validation error in each retry so the model can
        self-correct.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Error feedback is the right technique for correctable failures. It does not
        help when the data is not present to extract.
    - id: C
      text: >
        Detect that the information is absent from the provided source and route
        those documents for handling, rather than retrying.
      verdict: correct
      why: >
        Retries correct format and structural errors. They cannot supply information
        the source does not contain, so retrying is guaranteed to fail and only
        consumes budget.
    - id: D
      text: >
        Increase the retry limit so the model has more attempts to find the field.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        More attempts at an impossible task cost more and still fail.
  correct: [C]
  source: original

- id: d4-4.4-002
  domain: 4
  task_statement: "4.4"
  scenario: [6]
  select_count: 1
  stem: >
    You want the extraction pipeline to surface cases where a document's own figures
    are internally inconsistent, rather than silently picking one. What design most
    directly achieves this?
  options:
    - id: A
      text: >
        Have the model recalculate the total and return only the corrected value.
      verdict: wrong
      distractor_family: suppresses-signal
      why: >
        This hides the discrepancy by silently overriding the document, which may be
        the authoritative record.
    - id: B
      text: >
        Extract calculated_total alongside stated_total and add a conflict_detected
        boolean to flag discrepancies.
      verdict: correct
      why: >
        Capturing both values makes the inconsistency visible in the output rather
        than resolved invisibly during extraction, and the boolean gives downstream
        systems something to branch on.
    - id: C
      text: >
        Reject documents that fail an arithmetic check before extraction.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        You cannot run the arithmetic check before extracting the figures, and
        rejecting outright loses the rest of the usable data.
    - id: D
      text: >
        Instruct the model to report inconsistencies in a free-text notes field.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Free text is not machine-checkable, so downstream systems cannot reliably
        detect the flag.
  correct: [B]
  source: original

- id: d4-4.4-003
  domain: 4
  task_statement: "4.4"
  scenario: [5]
  select_count: 1
  stem: >
    Developers dismiss a significant fraction of review findings, but you cannot
    tell which code constructs are producing them. What change makes this
    analysable?
  options:
    - id: A
      text: >
        Add a detected_pattern field to each structured finding, recording the
        construct that triggered it.
      verdict: correct
      why: >
        Recording the triggering pattern turns "developers dismiss a lot of
        findings" into a distribution you can inspect, which is what makes the false
        positive sources fixable.
    - id: B
      text: >
        Have the model self-report confidence with each finding and correlate that
        with dismissals.
      verdict: wrong
      distractor_family: unreliable-proxy
      why: >
        Uncalibrated confidence correlates poorly with correctness, so the
        correlation would not identify which constructs are the problem.
    - id: C
      text: >
        Ask developers to add a reason when dismissing a finding.
      verdict: wrong
      distractor_family: shifts-burden
      why: >
        This makes the data collection someone else's manual work, and compliance
        will be partial.
    - id: D
      text: >
        Log the full source file alongside each finding for later inspection.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Storing raw context does not categorise anything, so the analysis remains
        manual.
  correct: [A]
  source: original

- id: d4-4.5-001
  domain: 4
  task_statement: "4.5"
  scenario: [5, 6]
  select_count: 1
  stem: >
    Your manager proposes moving two workflows to the Message Batches API for the
    50% cost saving - a blocking pre-merge check developers wait on, and an
    overnight technical debt report. How should you evaluate this?
  options:
    - id: A
      text: >
        Switch both to batch processing and poll for completion.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Polling does not change the absence of a latency guarantee. The developer
        may still be waiting hours.
    - id: B
      text: >
        Switch both to batch with a timeout fallback to synchronous if a batch runs
        long.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        This adds a dual-path system to work around a mismatch that disappears if
        each workflow simply uses the appropriate API.
    - id: C
      text: >
        Keep both synchronous, because batch results return out of order and cannot
        be matched to requests.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This rests on a misconception — custom_id correlates each result with its
        request regardless of ordering.
    - id: D
      text: >
        Use batch processing for the overnight report only, and keep synchronous
        calls for the pre-merge check.
      verdict: correct
      why: >
        Batch offers a 50% saving with processing times up to 24 hours and no
        guaranteed latency SLA. That is unsuitable for a check a developer is
        waiting on, and ideal for an overnight job.
  correct: [D]
  source: original

- id: d4-4.5-002
  domain: 4
  task_statement: "4.5"
  scenario: [6]
  select_count: 1
  stem: >
    A batch of 500 documents completes with 40 failures caused by documents that
    exceeded context limits. What is the most appropriate response?
  options:
    - id: A
      text: >
        Process the 40 failures synchronously instead, to avoid the batch size
        limits.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        The failure was per-document size, not batch size, so the same documents
        would exceed the limit synchronously too.
    - id: B
      text: >
        Resubmit the entire batch with a larger context configuration.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This reprocesses 460 documents that already succeeded, at full cost, to fix
        40.
    - id: C
      text: >
        Resubmit the 40 failed documents unchanged, since transient failures often
        succeed on retry.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Exceeding a context limit is deterministic, not transient. An unchanged
        retry fails identically.
    - id: D
      text: >
        Resubmit only the 40 failed documents, identified by custom_id, after
        chunking the oversized ones.
      verdict: correct
      why: >
        custom_id identifies exactly which requests failed, so only those need
        resubmission, and chunking addresses the specific cause rather than retrying
        the same oversized input.
  correct: [D]
  source: original

- id: d4-4.5-003
  domain: 4
  task_statement: "4.5"
  scenario: [6]
  select_count: 1
  stem: >
    You must guarantee that every submitted document is processed within 30 hours,
    using an API whose batch processing window is up to 24 hours. What submission
    cadence satisfies the requirement?
  options:
    - id: A
      text: >
        Submit continuously as documents arrive, one batch per document.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        This meets the SLA but discards the batching efficiency that motivated using
        the API, and multiplies request overhead.
    - id: B
      text: >
        Submit one batch every 24 hours, matching the processing window.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        A document arriving just after a submission waits nearly 24 hours to be
        included plus up to 24 to process, which exceeds 30.
    - id: C
      text: >
        Submit every four hours and escalate to synchronous processing for any batch
        still running at 24 hours.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        The four-hour cadence already satisfies the SLA, so the fallback path adds
        complexity with no benefit.
    - id: D
      text: >
        Submit batches every four hours, leaving headroom between the maximum
        processing window and the SLA.
      verdict: correct
      why: >
        A document arriving just after a submission waits up to four hours to be
        included, then up to 24 to process, for a worst case of 28 hours — inside
        the 30-hour commitment.
  correct: [D]
  source: original

- id: d4-4.6-001
  domain: 4
  task_statement: "4.6"
  scenario: [5]
  select_count: 1
  stem: >
    A pull request modifies 14 files. Your single-pass review gives detailed
    feedback on some files and superficial comments on others, misses obvious bugs,
    and flags a pattern as problematic in one file while approving identical code
    elsewhere in the same PR. How should you restructure the review?
  options:
    - id: A
      text: >
        Split into focused passes - analyse each file individually for local issues,
        then run a separate integration-focused pass examining cross-file data flow.
      verdict: correct
      why: >
        Uneven depth and self-contradiction within one review are the signature of
        attention dilution. Per-file passes give consistent depth, and a dedicated
        integration pass catches what no single file reveals.
    - id: B
      text: >
        Switch to a model with a larger context window so all 14 files fit
        comfortably in one pass.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Attention dilution is a quality problem, not a capacity one. More room to
        hold the files does not make the model attend to each as carefully.
    - id: C
      text: >
        Run three independent review passes over the full PR and flag only issues
        appearing in at least two of the three.
      verdict: wrong
      distractor_family: suppresses-signal
      why: >
        Consensus voting suppresses real bugs that are only caught intermittently,
        which are precisely the ones a review exists to find.
    - id: D
      text: >
        Require developers to split large pull requests into submissions of three
        to four files before the automated review runs.
      verdict: wrong
      distractor_family: shifts-burden
      why: >
        This moves the cost onto developers without improving the review system,
        which will behave the same way on the next large change.
  correct: [A]
  source: original

- id: d4-4.6-002
  domain: 4
  task_statement: "4.6"
  scenario: [5]
  select_count: 1
  stem: >
    Code generated in a session is then reviewed in that same session, and the
    review consistently finds nothing. Adding "review your work critically and
    question your assumptions" to the prompt has not changed the outcome. What is
    the most effective fix?
  options:
    - id: A
      text: >
        Enable extended thinking for the review step so the model reasons more
        deeply about its own output.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        More reasoning within the same context still starts from the same
        assumptions that produced the code.
    - id: B
      text: >
        Use a second, independent Claude instance to review the code without the
        generator's reasoning context.
      verdict: correct
      why: >
        The generating session retains its reasoning context, which makes it less
        likely to question its own decisions. An independent instance evaluates the
        code without that commitment.
    - id: C
      text: >
        Run the review after a delay so the earlier context is less salient.
      verdict: wrong
      distractor_family: unreliable-proxy
      why: >
        Elapsed time does not change what is in the session's context window.
    - id: D
      text: >
        Add explicit review criteria to the same session's prompt.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Criteria improve what gets reported. They do not remove the retained
        reasoning context that is suppressing findings.
  correct: [B]
  source: original

- id: d4-4.6-003
  domain: 4
  task_statement: "4.6"
  scenario: [5]
  select_count: 2
  stem: >
    You are designing a review architecture for large changes. Which TWO approaches
    are consistent with the guide's recommendations? Select TWO.
  options:
    - id: A
      text: >
        Run verification passes in which the model self-reports confidence alongside
        each finding, to enable calibrated review routing.
      verdict: correct
      why: >
        Finding-level confidence used to route reviewer attention is an endorsed
        skill, distinct from using self-reported confidence as a proxy for overall
        case complexity.
    - id: B
      text: >
        Have the generating session review its own output with an explicit
