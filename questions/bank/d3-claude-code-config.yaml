# Domain 3 — Claude Code Configuration & Workflows (20%)
# 18 original items, 3 per task statement. See ../question-style-guide.md
---
- id: d3-3.1-001
  domain: 3
  task_statement: "3.1"
  scenario: [2]
  select_count: 1
  stem: >
    Your team's commit message conventions are followed perfectly in your own
    sessions but ignored for every other developer, who all cloned the same
    repository. What is the most likely cause?
  options:
    - id: A
      text: >
        The conventions are in ~/.claude/CLAUDE.md, which is user-level and not
        shared through version control.
      verdict: correct
      why: >
        User-level configuration applies only to you. Instructions that must reach
        teammates belong at project level, where version control distributes them.
    - id: B
      text: >
        The conventions are too long, so other developers' sessions are truncating
        them.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Length affects adherence gradually, and would not produce a clean split
        between you and everyone else who cloned the same files.
    - id: C
      text: >
        The other developers are running from subdirectories, so the project
        CLAUDE.md is not being discovered.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Claude Code walks up the directory tree, so files above the working
        directory are still found.
    - id: D
      text: >
        The conventions need to be repeated in each package's CLAUDE.md to take
        effect.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Duplication is unnecessary and creates drift. A single project-level file
        reaches every developer.
  correct: [A]
  source: original

- id: d3-3.1-002
  domain: 3
  task_statement: "3.1"
  scenario: [2]
  select_count: 1
  stem: >
    A monorepo's root CLAUDE.md has grown to cover API conventions, testing
    standards, deployment procedures, and database patterns. Maintainers report that
    Claude increasingly ignores individual sections. What is the most appropriate
    restructuring?
  options:
    - id: A
      text: >
        Split it into focused topic files under .claude/rules/, and use @import in
        each package's CLAUDE.md to pull in only the standards that package needs.
      verdict: correct
      why: >
        Modular organisation keeps each file focused, and selective imports mean a
        package's context carries the standards relevant to it rather than all of
        them.
    - id: B
      text: >
        Reorder the file so the most important sections appear first.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Ordering shifts which sections suffer rather than reducing the total volume
        competing for attention.
    - id: C
      text: >
        Move the entire file to ~/.claude/CLAUDE.md so it loads once per user
        instead of per project.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This makes the standards personal rather than shared, and does nothing about
        file size.
    - id: D
      text: >
        Convert each section into a skill so Claude loads only the relevant one.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Skills are for on-demand task-specific workflows. Universal standards that
        should always apply belong in always-loaded configuration.
  correct: [A]
  source: original

- id: d3-3.1-003
  domain: 3
  task_statement: "3.1"
  scenario: [2]
  select_count: 1
  stem: >
    Claude's behaviour differs between two sessions started in the same repository,
    and you suspect a configuration file is not being picked up in one of them.
    According to the exam guide, what is the appropriate diagnostic step?
  options:
    - id: A
      text: >
        Use the /memory command to verify which memory files are loaded.
      verdict: correct
      why: >
        The guide identifies /memory as the command for verifying loaded memory
        files and diagnosing inconsistent behaviour across sessions.
    - id: B
      text: >
        Add a marker instruction to each CLAUDE.md and check which markers Claude
        echoes back.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        This builds an ad-hoc detection scheme, and relies on the model complying
        with the marker instruction, when a direct command exists.
    - id: C
      text: >
        Compare file modification timestamps to determine which was loaded most
        recently.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Timestamps say when a file changed on disk, not whether a session loaded it.
    - id: D
      text: >
        Restart both sessions from the repository root to eliminate directory
        differences.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This may change the symptom without telling you which files were loaded, so
        the underlying cause stays unknown.
  correct: [A]
  source: original

- id: d3-3.2-001
  domain: 3
  task_statement: "3.2"
  scenario: [2, 4]
  select_count: 1
  stem: >
    You want a /deploy-check command running your team's pre-deployment checklist,
    available to every developer as soon as they clone or pull the repository. Where
    should the file live?
  options:
    - id: A
      text: >
        In .claude/commands/ within the project repository.
      verdict: correct
      why: >
        Project-scoped commands live in .claude/commands/ and are distributed
        through version control, so every developer receives them on clone or pull.
    - id: B
      text: >
        In ~/.claude/commands/ on each developer's machine.
      verdict: wrong
      distractor_family: shifts-burden
      why: >
        User-scoped commands are personal and not shared, so every developer would
        have to install the file themselves.
    - id: C
      text: >
        In the project's CLAUDE.md, as a documented checklist section.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        CLAUDE.md carries project instructions and context. It does not define
        invocable commands.
    - id: D
      text: >
        In a .claude/config.json file with a commands array.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This describes a configuration mechanism that does not exist.
  correct: [A]
  source: original

- id: d3-3.2-002
  domain: 3
  task_statement: "3.2"
  scenario: [4]
  select_count: 1
  stem: >
    A codebase-analysis skill produces several hundred lines of file listings and
    call traces. After invoking it, the main conversation is dominated by that
    output and subsequent work degrades. Which frontmatter option addresses this?
  options:
    - id: A
      text: >
        context set to fork, so the skill runs in an isolated sub-agent context.
      verdict: correct
      why: >
        Forking runs the skill in a separate context and returns only its result,
        which keeps verbose intermediate output out of the main conversation.
    - id: B
      text: >
        allowed-tools, restricting the skill to read-only tools so it produces less
        output.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Restricting tools does not reduce the volume of output that read operations
        produce, which is the stated problem.
    - id: C
      text: >
        argument-hint, so the developer can scope the analysis when invoking it.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        argument-hint prompts for parameters at invocation. It does not isolate the
        skill's output from the main context.
    - id: D
      text: >
        Move the skill to ~/.claude/skills/ so it runs in the user context rather
        than the project one.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Scope determines who has the skill, not where its output lands.
  correct: [A]
  source: original

- id: d3-3.2-003
  domain: 3
  task_statement: "3.2"
  scenario: [2]
  select_count: 1
  stem: >
    Your team has a shared release skill. You want a personal variant with an extra
    step, without changing behaviour for anyone else. What is the appropriate
    approach?
  options:
    - id: A
      text: >
        Create a variant in ~/.claude/skills/ under a different name.
      verdict: correct
      why: >
        Personal customisation belongs in user scope, and using a different name
        avoids any collision with the shared skill your teammates depend on.
    - id: B
      text: >
        Edit the project skill and add a conditional step that runs only for your
        username.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This puts personal logic into a shared, version-controlled file that the
        whole team must now read and maintain.
    - id: C
      text: >
        Copy the project skill into ~/.claude/skills/ under the same name so yours
        takes precedence.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Reusing the name creates a shadowing relationship that is easy to forget
        and hard to diagnose when the shared skill later changes.
    - id: D
      text: >
        Add the extra step to your ~/.claude/CLAUDE.md so it applies whenever you
        run the release skill.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        An always-loaded instruction is not scoped to a skill invocation, and would
        apply in unrelated contexts.
  correct: [A]
  source: original

- id: d3-3.3-001
  domain: 3
  task_statement: "3.3"
  scenario: [2]
  select_count: 1
  stem: >
    Test files in your project sit beside the code they test — Button.test.tsx next
    to Button.tsx, useAuth.test.ts next to useAuth.ts — across dozens of
    directories. All tests must follow the same conventions regardless of where they
    live. What is the most maintainable way to have Claude apply them automatically?
  options:
    - id: A
      text: >
        Create a file in .claude/rules/ with YAML frontmatter specifying a paths
        glob such as "**/*.test.*".
      verdict: correct
      why: >
        Glob-scoped rules apply by file pattern regardless of directory, which is
        exactly what conventions following file type across a scattered layout
        require.
    - id: B
      text: >
        Place a CLAUDE.md in each directory containing test files.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Directory-bound files cannot cleanly cover files spread across dozens of
        directories, and each new directory needs another copy.
    - id: C
      text: >
        Consolidate the conventions in the root CLAUDE.md under a "Testing" heading.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This relies on the model inferring when the section applies rather than
        matching explicitly on file path.
    - id: D
      text: >
        Create a testing skill in .claude/skills/ containing the conventions.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Skills require invocation or a relevance judgment, which contradicts the
        requirement for automatic application based on file path.
  correct: [A]
  source: original

- id: d3-3.3-002
  domain: 3
  task_statement: "3.3"
  scenario: [2]
  select_count: 1
  stem: >
    You have a .claude/rules/ file with no paths frontmatter field. When does it
    load?
  options:
    - id: A
      text: >
        At launch, unconditionally, with the same priority as .claude/CLAUDE.md.
      verdict: correct
      why: >
        The paths field is what makes a rule conditional. Without it, the rule is
        loaded like other always-on project configuration.
    - id: B
      text: >
        Only when Claude reads a file in the same directory as the rule.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Directory-triggered loading describes subdirectory CLAUDE.md files, not
        rules files.
    - id: C
      text: >
        Never — a rule without paths has no activation condition and is ignored.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        The absence of paths means unconditional loading, not no loading.
    - id: D
      text: >
        Only when the developer invokes it explicitly.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Explicit invocation describes skills. Rules are loaded, not invoked.
  correct: [A]
  source: original

- id: d3-3.3-003
  domain: 3
  task_statement: "3.3"
  scenario: [2]
  select_count: 1
  stem: >
    Your infrastructure conventions apply only to files under terraform/. Team
    members working on application code report that irrelevant Terraform guidance
    is consuming context in every session. What is the most appropriate change?
  options:
    - id: A
      text: >
        Move the conventions into .claude/rules/ with a paths glob scoped to
        "terraform/**/*".
      verdict: correct
      why: >
        Path-scoped rules load only when Claude works with matching files, which
        removes the guidance from sessions that never touch Terraform.
    - id: B
      text: >
        Shorten the Terraform section so it consumes less context.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Shortening reduces the cost but keeps irrelevant guidance in every session,
        and loses detail the Terraform work actually needs.
    - id: C
      text: >
        Ask application developers to run Claude from their package directory so
        the root file is not loaded.
      verdict: wrong
      distractor_family: shifts-burden
      why: >
        Claude Code walks up the directory tree, so this does not work, and it puts
        the workaround on the developers.
    - id: D
      text: >
        Move the conventions into a CLAUDE.md inside the terraform/ directory.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This is a reasonable option here since the files are confined to one
        directory, but path-scoped rules give the same conditional loading while
        remaining usable if Terraform files later appear elsewhere.
  correct: [A]
  source: original

- id: d3-3.4-001
  domain: 3
  task_statement: "3.4"
  scenario: [2]
  select_count: 1
  stem: >
    You are asked to break a monolithic application into services. The work spans
    dozens of files and requires decisions about service boundaries and module
    dependencies. Which approach should you take?
  options:
    - id: A
      text: >
        Enter plan mode to explore the codebase, understand dependencies, and design
        an approach before making changes.
      verdict: correct
      why: >
        The task combines large scale with genuine architectural uncertainty, which
        is what plan mode exists for. Exploring before committing prevents costly
        rework when dependencies surface late.
    - id: B
      text: >
        Start with direct execution and make changes incrementally, letting the
        implementation reveal the natural service boundaries.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Discovering dependencies late means reworking earlier changes, which is the
        cost plan mode is designed to avoid.
    - id: C
      text: >
        Use direct execution with comprehensive upfront instructions specifying how
        each service should be structured.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This assumes you already know the correct structure without having explored
        the dependencies.
    - id: D
      text: >
        Begin in direct execution and switch to plan mode only if unexpected
        complexity appears.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        The complexity is already stated in the requirements. There is nothing to
        wait to discover.
  correct: [A]
  source: original

- id: d3-3.4-002
  domain: 3
  task_statement: "3.4"
  scenario: [2]
  select_count: 1
  stem: >
    A bug report includes a stack trace pointing at a single function that fails on
    null input. The fix is a guard clause. Which approach is appropriate?
  options:
    - id: A
      text: >
        Direct execution — the change is well-scoped and the approach is not in
        question.
      verdict: correct
      why: >
        Plan mode earns its overhead when the approach is uncertain. Here both the
        location and the fix are known, so planning adds cost with no benefit.
    - id: B
      text: >
        Plan mode, to check whether other call sites have the same problem before
        changing anything.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        Broadening the task is a decision to make explicitly, not a reason to plan a
        change whose approach is already clear.
    - id: C
      text: >
        Plan mode, because any change to shared code has architectural implications.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        A guard clause in one function is not an architectural decision, and this
        reasoning would make every change require planning.
    - id: D
      text: >
        Direct execution, preceded by an Explore subagent run to map the call graph.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        The Explore subagent is for verbose discovery phases. A known single-file
        fix with a stack trace needs no discovery.
  correct: [A]
  source: original

- id: d3-3.4-003
  domain: 3
  task_statement: "3.4"
  scenario: [2, 4]
  select_count: 1
  stem: >
    During a multi-phase migration, the discovery phase produces so much file
    listing and dependency output that the context is nearly full before
    implementation begins. What is the most appropriate technique?
  options:
    - id: A
      text: >
        Run the discovery phase through the Explore subagent, which isolates verbose
        output and returns a summary.
      verdict: correct
      why: >
        The Explore subagent exists to keep verbose discovery out of the main
        conversation, preserving context for the phases that follow.
    - id: B
      text: >
        Split the migration into several sessions, one per phase.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This addresses context pressure by discarding continuity, and each new
        session must re-establish what the previous one learned.
    - id: C
      text: >
        Run /compact after the discovery phase completes.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Compacting after the fact recovers some room but has already paid the cost
        of the verbose output entering the main context, and summarisation is lossy.
    - id: D
      text: >
        Reduce the scope of the discovery phase so it produces less output.
      verdict: wrong
      distractor_family: shifts-burden
      why: >
        Narrowing discovery to fit the context risks missing dependencies the
        migration needs, trading correctness for room.
  correct: [A]
  source: original

- id: d3-3.5-001
  domain: 3
  task_statement: "3.5"
  scenario: [2]
  select_count: 1
  stem: >
    You have described a data transformation in prose three times, and each attempt
    produces a differently shaped result. What is the most effective next step?
  options:
    - id: A
      text: >
        Provide two or three concrete input/output examples of the transformation.
      verdict: correct
      why: >
        Concrete examples are the most effective way to communicate an expected
        transformation when prose is being interpreted inconsistently — the prose is
        the source of the inconsistency.
    - id: B
      text: >
        Rewrite the description with more precise language and additional detail.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        More prose is more of the thing that is failing. Three attempts already
        indicate the medium rather than the wording.
    - id: C
      text: >
        Write a JSON schema for the output and require the model to conform to it.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        A schema constrains shape but does not communicate the transformation
        semantics, which is what is being misunderstood.
    - id: D
      text: >
        Ask the model to restate its understanding before implementing.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Useful for surfacing unknowns in an unfamiliar domain, but here the
        requirement is known and simply needs a clearer expression.
  correct: [A]
  source: original

- id: d3-3.5-002
  domain: 3
  task_statement: "3.5"
  scenario: [2]
  select_count: 1
  stem: >
    You are reviewing generated code and have found four defects. Two of them
    interact — fixing the caching bug changes how the retry logic must behave. The
    other two are unrelated. How should you communicate them?
  options:
    - id: A
      text: >
        Send the two interacting defects together in one detailed message, and
        address the two independent ones separately.
      verdict: correct
      why: >
        Interacting problems must be seen together or each fix perturbs the other.
        Independent problems are easier to attribute and verify when handled
        separately.
    - id: B
      text: >
        Send all four in a single message so the model has full context.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Batching independent issues makes it harder to attribute which change fixed
        what, without any benefit since they do not interact.
    - id: C
      text: >
        Send all four sequentially, one per message, in severity order.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Fixing the two interacting defects one at a time causes each fix to
        invalidate the other.
    - id: D
      text: >
        Write a test suite covering all four and share only the failures.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Test-driven iteration is a strong technique, but it does not change the
        batching decision — the interacting failures still need to be seen together.
  correct: [A]
  source: original

- id: d3-3.5-003
  domain: 3
  task_statement: "3.5"
  scenario: [2]
  select_count: 1
  stem: >
    You need to implement a caching layer in a domain you have not worked in before,
    and you are unsure which failure modes and invalidation strategies matter. Which
    technique best fits?
  options:
    - id: A
      text: >
        The interview pattern — have Claude ask questions to surface design
        considerations before implementing.
      verdict: correct
      why: >
        The interview pattern exists to surface considerations the developer has not
        anticipated, which is exactly the position of working in an unfamiliar
        domain.
    - id: B
      text: >
        Provide input/output examples of the caching behaviour you expect.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Examples communicate a transformation you already understand. Here the gap
        is knowing which behaviours to specify.
    - id: C
      text: >
        Write a test suite first and iterate on the failures.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        You cannot write tests for failure modes you have not identified yet, which
        is the stated gap.
    - id: D
      text: >
        Ask for three alternative implementations and compare them.
      verdict: wrong
      distractor_family: over-engineered
      why: >
        Generating three implementations you are not equipped to evaluate does not
        resolve the underlying uncertainty.
  correct: [A]
  source: original

- id: d3-3.6-001
  domain: 3
  task_statement: "3.6"
  scenario: [5]
  select_count: 1
  stem: >
    Your CI job runs claude "Review this pull request for security issues" and hangs
    indefinitely. Logs indicate Claude Code is waiting for interactive input. What
    is the correct fix?
  options:
    - id: A
      text: >
        Add the -p flag - claude -p "Review this pull request for security issues".
      verdict: correct
      why: >
        The -p (or --print) flag runs Claude Code non-interactively, processing the
        prompt and exiting without waiting for input, which is what an automated
        pipeline requires.
    - id: B
      text: >
        Set an environment variable such as CLAUDE_HEADLESS=true before running the
        command.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This references a mechanism that does not exist.
    - id: C
      text: >
        Redirect stdin from /dev/null so the process cannot block on input.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        A shell workaround that does not properly address the command's own
        interactive mode, and produces unpredictable behaviour rather than a clean
        non-interactive run.
    - id: D
      text: >
        Add a --batch flag to run in unattended mode.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This flag does not exist.
  correct: [A]
  source: original

- id: d3-3.6-002
  domain: 3
  task_statement: "3.6"
  scenario: [5]
  select_count: 1
  stem: >
    Your automated review posts the same twelve comments on every push to a pull
    request, including issues the developer already addressed. What change most
    effectively fixes this?
  options:
    - id: A
      text: >
        Include the prior review findings in context and instruct Claude to report
        only new or still-unaddressed issues.
      verdict: correct
      why: >
        Each run is independent and has no knowledge of previous reviews. Supplying
        the prior findings gives it the basis to distinguish new issues from ones
        already reported.
    - id: B
      text: >
        Deduplicate comments in the posting step by comparing text against existing
        comments on the pull request.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        Text deduplication suppresses repeats but cannot tell an unaddressed issue
        from a resolved one, so genuinely unresolved findings get silently dropped.
    - id: C
      text: >
        Run the review only on the first push and skip subsequent ones.
      verdict: wrong
      distractor_family: suppresses-signal
      why: >
        This eliminates duplicates by eliminating review of every change after the
        first, which is when regressions are introduced.
    - id: D
      text: >
        Restrict the review to the diff of the most recent commit.
      verdict: wrong
      distractor_family: solves-different-problem
      why: >
        This narrows what is reviewed rather than tracking what was already
        reported, and misses issues spanning several commits.
  correct: [A]
  source: original

- id: d3-3.6-003
  domain: 3
  task_statement: "3.6"
  scenario: [5]
  select_count: 1
  stem: >
    Your CI review produces useful prose that a human reads, but you need to post
    findings as inline comments on specific lines. What combination achieves this?
  options:
    - id: A
      text: >
        --output-format json together with --json-schema, to produce
        machine-parseable structured findings.
      verdict: correct
      why: >
        Structured output against a schema gives the pipeline predictable fields —
        file, line, severity, message — that it can map onto inline comments.
    - id: B
      text: >
        Instruct the model in the prompt to format findings as "file:line: message"
        and parse the output with a regular expression.
      verdict: wrong
      distractor_family: prompt-instead-of-enforcement
      why: >
